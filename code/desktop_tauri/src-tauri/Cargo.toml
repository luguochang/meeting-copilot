[package]
name = "meeting-copilot-desktop"
version = "0.1.0"
edition = "2021"
authors = ["luguochang"]
description = "Local-first desktop meeting assistant"
homepage = "https://github.com/luguochang/meeting-copilot"
repository = "https://github.com/luguochang/meeting-copilot"
license-file = "../../../LICENSE"

[lib]
name = "meeting_copilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.5.4"
url = "2"

[target.'cfg(windows)'.dependencies.tungstenite]
version = "0.28"
default-features = false
features = ["handshake"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
